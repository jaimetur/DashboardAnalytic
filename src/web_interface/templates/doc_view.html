{% extends 'base.html' %}
{% block content %}
<section class="doc-page">
  <article class="panel doc-panel">
    <div class="doc-toolbar">
      <div>
        <p class="eyebrow">Documentation</p>
        <h2>{{ doc_name }}</h2>
      </div>
      <a class="ghost-link" href="/workspace">Back to Workspace</a>
    </div>
    <p id="doc-path" class="doc-meta">Loading document...</p>
    {% if help_navigation %}
    <div class="doc-layout">
      <aside class="doc-sidebar" aria-label="Help navigation">
        <h3>Help Navigation</h3>
        <p>Browse the available documentation.</p>
        <nav><ul id="help-nav-list" class="help-nav-list"></ul></nav>
      </aside>
      <article id="doc-content" class="doc-markdown markdown-viewer"></article>
    </div>
    {% else %}
    <article id="doc-content" class="doc-markdown markdown-viewer"></article>
    {% endif %}
  </article>
</section>
{% endblock %}
{% block extra_scripts %}
<script src="{{ static_path('markdown_renderer.js') }}?v={{ asset_version('markdown_renderer.js') }}"></script>
<script>
(function () {
  const pathEl = document.getElementById('doc-path');
  const contentEl = document.getElementById('doc-content');
  const helpNavEl = document.getElementById('help-nav-list');
  let currentDocumentPath = '';
  if (!pathEl || !contentEl || !window.MarkdownRenderer) return;

  function resolveDocUrl(rawUrl, isImage) {
    const raw = String(rawUrl || '').trim();
    if (!raw) return '';
    if (/^(https?:|mailto:|#)/i.test(raw)) return raw;
    if (raw.startsWith('/')) return raw;

    const normalized = raw.replace(/\\/g, '/').replace(/^\.\//, '');
    const lower = normalized.toLowerCase();
    if (lower === 'readme.md' || lower.endsWith('/readme.md')) return '/documents/view/readme';
    if (lower === 'changelog.md' || lower.endsWith('/changelog.md')) return '/documents/view/changelog';
    if (lower === 'help.md' || lower === '00-help.md' || lower.endsWith('/help.md') || lower.endsWith('/00-help.md')) return '/documents/view/help';
    if (lower.endsWith('.md')) {
      const marker = '/help/';
      const current = currentDocumentPath.replace(/\\/g, '/');
      const markerIndex = current.toLowerCase().indexOf(marker);
      if (markerIndex >= 0) {
        const currentRelative = current.slice(markerIndex + marker.length);
        const baseParts = currentRelative.split('/').slice(0, -1);
        const resolvedParts = [...baseParts, ...normalized.split('/')];
        const safeParts = [];
        resolvedParts.forEach((part) => {
          if (!part || part === '.') return;
          if (part === '..') { safeParts.pop(); return; }
          safeParts.push(part);
        });
        return `/documents/view/help/${safeParts.join('/')}`;
      }
    }
    if (isImage) {
      if (lower.startsWith('src/web_interface/static/')) {
        return `/static/${normalized.slice('src/web_interface/static/'.length)}`;
      }
      if (lower.startsWith('web_interface/static/')) {
        return `/static/${normalized.slice('web_interface/static/'.length)}`;
      }
      if (lower.startsWith('static/')) {
        return `/${normalized}`;
      }
    }
    return isImage ? raw : raw;
  }

  const markdownRenderer = window.MarkdownRenderer.create({
    resolveUrl: resolveDocUrl,
    includeHeadingIds: false,
  });

  fetch({{ doc_api_url | tojson }})
    .then(async (response) => {
      const data = await response.json();
      if (!response.ok) {
        throw new Error(data && data.detail ? String(data.detail) : 'Unable to load document.');
      }
      currentDocumentPath = data.path || '';
      pathEl.textContent = currentDocumentPath;
      contentEl.innerHTML = markdownRenderer.render(data.content || '');
    })
    .catch((error) => {
      pathEl.textContent = '';
      contentEl.innerHTML = `<p>${window.MarkdownRenderer.escapeHtml(error.message || 'Unable to load document.')}</p>`;
    });

  function formatHelpLabel(relativePath) {
    const fileName = String(relativePath || '').split('/').pop() || '';
    return fileName.replace(/\.md$/i, '').replace(/[-_]+/g, ' ').replace(/^\d+\s*/, '').replace(/\b\w/g, (letter) => letter.toUpperCase());
  }

  if (helpNavEl) {
    fetch('/api/documents/help-index')
      .then(async (response) => ({response, data: await response.json()}))
      .then(({response, data}) => {
        if (!response.ok || !Array.isArray(data.documents)) throw new Error('Unable to load help navigation.');
        data.documents.forEach((helpDocument) => {
          const item = document.createElement('li');
          const link = document.createElement('a');
          link.href = helpDocument.url;
          const position = data.documents.indexOf(helpDocument);
          const number = helpDocument.number || String(position).padStart(2, '0');
          const label = position === 0 ? 'Help Home' : (helpDocument.label || formatHelpLabel(helpDocument.relative_path));
          link.textContent = position === 0 ? `${number}. ${label} 🏠` : `${number}. ${label}`;
          if (link.pathname === window.location.pathname) link.classList.add('active');
          item.appendChild(link);
          helpNavEl.appendChild(item);
        });
      })
      .catch(() => {
        helpNavEl.innerHTML = '<li>Unable to load help navigation.</li>';
      });
  }
})();
</script>
{% endblock %}
