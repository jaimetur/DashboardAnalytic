# Dashboard Analytic storage roots
#
# If this file is absent, Dashboard Analytic uses config/, data/ and assets/
# inside the project automatically. Edit the value on the right of each "=" while the application is stopped,
# then restart Dashboard Analytic. Relative paths are resolved from this
# project root. You can use absolute paths or "~" for your home directory.
#
# Environment variables with the same name take precedence. This lets Docker
# or another deployment override these local defaults without changing this
# file. Do not add passwords or other secrets here.

CONFIG_DIR = /Users/jaimetur/DashboardAnalytic/config
DATA_DIR = /Users/jaimetur/DashboardAnalytic/data
ASSETS_DIR = assets
