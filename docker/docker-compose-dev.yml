services:
  app-dev:
    build:
      context: ..
      dockerfile: docker/dockerfile
    container_name: ${CONTAINER_NAME}-dev
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Europe/Madrid}
      DASHBOARD_ANALYTIC_BIND_PORT: "7278"
      DASHBOARD_ANALYTIC_RELOAD: "true"
    ports:
      - "${APP_DEV_PORT}:7278"
    volumes:
      - ../src:/app/src
      - ${HOST_CONFIG_DIR}:/app/config
      - ${HOST_DATA_DIR}:/app/data
    command: python -m src.main
    restart: unless-stopped
